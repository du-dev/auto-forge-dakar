[build]
  command = "npm run build"
  publish = "dist"
  installCommand = "npm install --legacy-peer-deps"

[build.environment]
  NITRO_PRESET = "netlify"

# Sert toutes les routes en statique (index.html) pour que le SSR ne soit pas appelé
# TanStack Router gère la navigation côté client
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
